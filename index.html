e.innerHTML=msgs.length?msgs.map(m=>{const h=new Date(m.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),d=m.tipo==='dado';
const tg=m.tipo==='npc'?'<span class=tg>NPC</span>':m.tipo==='gm'?'<span class="tg g">MESTRE</span>':'';
return(m.id===pri?`<div class=nl id=dvn>Mensagens não lidas (${nl.length})</div>`:'')+`<div class="m ${m.tipo} ${avm(m)?'ha':''} ${m.uid===uid?'me':''}" id="m-${m.id}" style="${cb(m)}">${avm(m)?`<img class=mav src="${esc(avm(m))}" onclick="ampliar(this.src)" title="Ampliar">`:''}<div class=n style="color:${cor(m.uid)}">${esc(m.nome)}${tg}${hpm(m)} <span class=mu>${h}${m.ed?' · editada':''}</span>${monitor?'':acoes(m,d)}</div>${m.re&&!m.apagada?`<div class=rp onclick="irPara('${esc(m.re.id)}')" style="border-left:3px solid ${cor(m.re.u)}"><b style="color:${cor(m.re.u)}">${esc(m.re.nome)}</b><br>${esc(m.re.t)}</div>`:''}${m.apagada?'<i class=mu>🚫 Mensagem apagada</i>':d?'🎲 '+esc(m.texto):fmt(m.texto)+mid(m.midia)}${m.id===ult&&vistos.length?`<div class=mu style="font-size:11px;text-align:right;margin-top:3px">👁 Visto por ${esc(vistos.slice(0,3).join(', '))}${vistos.length>3?' +'+(vistos.length-3):''}</div>`:''}</div>`}).join(''):'<p class=mu style="text-align:center">Nenhuma mensagem ainda. Comece a aventura!</p>';
if(!entrou){entrou=true;semScroll=Date.now()+800;const dv=$('#dvn');if(dv)e.scrollTop=Math.max(0,dv.getBoundingClientRect().top-e.getBoundingClientRect().top+e.scrollTop-60);else e.scrollTop=e.scrollHeight}
else if(b){e.scrollTop=e.scrollHeight;if(!sem&&nl.length&&!document.hidden)marcaLido()}}
/* ---------- macros ---------- */
function vMacros(){const v=macros.filter(m=>m.publica||m.dono===uid);$('#ab').innerHTML=`<div class=c><button onclick="novaMacro()" style="width:100%">+ Nova macro</button><p class=mu>Use no chat digitando #nome. Dados dentro de //…// são rolados. Ex.: Josias atacou ferozmente! //2d20+5//</p>${v.map(m=>`<div class=card><b>#${esc(m.nome)}</b> <span class=tg>${m.publica?'Pública':'Particular'}</span><div class=mu>${esc(m.texto)}</div>${m.dono===uid||ehM()?`<button class="s" style="margin-top:8px" onclick="delMacro('${m.id}')">Excluir</button>`:''}</div>`).join('')||'<p class=mu>Nenhuma macro criada.</p>'}</div>`}
function novaMacro(){modal('Nova macro',[{l:'Nome (sem espaços)'},{l:'Texto da macro',ml:1},{l:'Pública? Digite "sim" para todos usarem'}],([n,t,p])=>{n=n.replace(/\s+/g,'');if(!n||!t)return alert('Preencha o nome e o texto da macro.');db.collection('campanhas/'+cid+'/macros').add({nome:n,texto:t,dono:uid,publica:/^s/i.test(p)})})}
const delMacro=id=>db.doc('campanhas/'+cid+'/macros/'+id).delete();
/* ---------- fichas ---------- */
function vPers(){const p=pers.find(x=>x.id===ativo);if(p)return fichaDe(p);
const lst=npc=>{const v=pers.filter(x=>!!x.npc===!!npc&&(!npc||x.dono===uid||ehM()||x.visivel)).sort(az);return`<h3>${npc?'🎭 NPCs':'📜 Personagens'}</h3><button onclick="novoPers(${npc})" style="width:100%;margin-bottom:8px">+ ${npc?'Novo NPC':'Novo personagem'}</button>${v.map(x=>`<div class="card it" onclick="ativo='${x.id}';tab()">${x.img?`<img class=av style="width:40px;height:40px" src="${esc(x.img)}">`:''}<b>${esc(x.nome)}</b><span class=mu>${hpTxt(x)} ${npc?(x.visivel?'👁':'🙈'):esc(x.donoNome||'')}</span></div>`).join('')||`<p class=mu>${npc?'Você ainda não criou NPCs.':'Você ainda não tem personagens.'}</p>`}`};
$('#ab').innerHTML=`<div class=c>${lst(0)}${lst(1)}</div>`}
const novoPers=npc=>modal(npc?'Novo NPC':'Novo personagem',[{l:npc?'Nome do NPC':'Nome do personagem'}].concat(npc?[{l:'Visível para os jogadores? Digite "sim" para mostrar (padrão: oculto)'}]:[]),([n,vv])=>{if(!n)return;const id=gid();db.doc('campanhas/'+cid+'/personagens/'+id).set({nome:n,dono:uid,donoNome:eu.nome,v:{},npc:!!npc,visivel:!!npc&&/^s/i.test(vv||'')}).then(()=>{ativo=id;tab()})});
async function imgPers(el){const f=el.files[0];el.value='';if(!f)return;if(!f.type.startsWith('image/'))return alert('Envie uma imagem.');if(f.size>8*1048576)return alert('Imagem muito grande. O limite é 8 MB.');
try{const u=await db.upload(f,cid+'/avatares');await db.doc('campanhas/'+cid+'/personagens/'+ativo).update({img:u});const p=pers.find(x=>x.id===ativo);if(p)p.img=u;tab()}catch(e){alert('Não foi possível enviar a imagem. Confira se o arquivo atualizar.sql foi executado no Supabase.')}}
const vida=p=>`<h3>❤️ Vida</h3><div class=card><div class=row><div><label>PV atuais</label><input type=number value="${p.pv??''}" onchange="sPV('pv',this.value)"></div><div><label>PV máximos</label><input type=number value="${p.pvmax??''}" onchange="sPV('pvmax',this.value)"></div></div><div class=row style="margin-top:8px"><button class=s onclick="pvD(-1)">− 1 (dano)</button><button class=s onclick="pvD(1)">+ 1 (cura)</button></div><p class=mu>${hpTxt(p)?'No chat aparece: '+hpTxt(p):'Preencha os PV para a vida aparecer no chat.'}</p></div>`;
async function sPV(c,v){const p=pers.find(x=>x.id===ativo);p[c]=v===''?null:+v;if(c==='pv'&&p.pvmax==null)p.pvmax=p.pv;if(c==='pvmax'&&p.pv==null)p.pv=p.pvmax;await db.doc('campanhas/'+cid+'/personagens/'+ativo).update({pv:p.pv??null,pvmax:p.pvmax??null});tab()}
async function pvD(d){const p=pers.find(x=>x.id===ativo);if(p.pv==null)return alert('Preencha os PV atuais primeiro.');p.pv=Math.min(p.pvmax??1e9,Math.max(0,p.pv+d));await db.doc('campanhas/'+cid+'/personagens/'+ativo).update({pv:p.pv});tab()}
function fichaDe(p){fichaD0(p);if(!pode(p)){const a=$('#ab');a.querySelectorAll('input,textarea,select').forEach(x=>x.disabled=true);a.querySelectorAll('button').forEach(b=>{if(!/ativo=null/.test(b.getAttribute('onclick')||''))b.style.display='none'})}}
function fichaD0(p){const mo=camp.modelo.secoes,v=p.v||{};const dono=ehM()?`<label>Jogador responsável</label><select onchange="atribuir('${p.id}',this.value)">${membros.map(m=>`<option value="${m.id}" ${m.id===p.dono?'selected':''}>${esc(m.nome)}</option>`).join('')}</select>`:'';
$('#ab').innerHTML=`<div class=c><div class=row><button class=s onclick="ativo=null;tab()">‹ Voltar</button><button class=x onclick="delPers('${p.id}')">Excluir</button></div><h2>${esc(p.nome)} <button class=s style="padding:3px 9px" onclick="renomear()" title="Renomear">✎</button></h2><div class=row style="margin-bottom:8px">${p.img?`<img class=big src="${esc(p.img)}">`:'<div class=big></div>'}<div><button class=s onclick="$('#ai').click()">📷 ${p.img?'Trocar':'Adicionar'} imagem</button><input id=ai type=file accept="image/*" style="display:none" onchange="imgPers(this)"></div></div>${dono}${corBloco(p)}${p.npc?vis(p):''}${vida(p)}${mo.map((s,i)=>`<h3>${esc(s.t)}</h3><div class=card>${s.campos.map((c,j)=>{const x=v[c.n]??'';const L=`<label>${esc(c.n)}</label>`;
if(c.k==='attr')return L+`<div class=row><input type=number value="${esc(x)}" oninput="this.nextElementSibling.textContent=md(this.value)" onchange="sv(${i},${j},this.value)"><b class=mod>${md(x)}</b><button class=s onclick="testar(${i},${j})">🎲</button></div>`;
if(c.k==='long')return L+`<textarea onchange="sv(${i},${j},this.value)">${esc(x)}</textarea>`;return L+`<input type=${c.k==='num'?'number':'text'} value="${esc(x)}" onchange="sv(${i},${j},this.value)">`}).join('')}</div>`).join('')}</div>`}
function sv(i,j,val){const c=camp.modelo.secoes[i].campos[j],p=pers.find(x=>x.id===ativo);p.v={...(p.v||{}),[c.n]:val};db.doc('campanhas/'+cid+'/personagens/'+ativo).update({v:p.v})}
function testar(i,j){const c=camp.modelo.secoes[i].campos[j],p=pers.find(x=>x.id===ativo),m=Math.floor(((+(p.v||{})[c.n]||0)-10)/2),r=rolar('d20'+(m<0?m:'+'+m));enviarMsg({tipo:'pers',nome:p.nome},'Teste de '+c.n+' — '+r.txt,1);alert('Resultado enviado ao chat: '+r.txt)}
const atribuir=(id,u)=>{const m=membros.find(x=>x.id===u);db.doc('campanhas/'+cid+'/personagens/'+id).update({dono:u,donoNome:m.nome})};
const delPers=id=>{if(confirm('Excluir este personagem?')){db.doc('campanhas/'+cid+'/personagens/'+id).delete();ativo=null;tab()}};
/* ---------- modelo de ficha ---------- */
function vModelo(){if(!ehM()){$('#ab').innerHTML='<div class=c><p>Somente o mestre pode editar o modelo de ficha desta campanha.</p></div>';return}mod=mod||JSON.parse(JSON.stringify(camp.modelo));edM()}
function edM(){const T={attr:'Atributo (com modificador)',num:'Número',txt:'Texto curto',long:'Texto longo'};
$('#ab').innerHTML=`<div class=c><h3>Modelo de ficha</h3><div class=q><button class=s onclick="expMod()">⬇️ Exportar modelo</button><button class=s onclick="$('#im').click()">⬆️ Importar modelo</button><input id=im type=file accept=".json,application/json" style="display:none" onchange="impMod(this)"></div><div class=q style="margin-top:6px"><button class=s onclick="mod=JSON.parse(JSON.stringify(MODELOS.dnd));edM()">Modelo D&amp;D 5e</button><button class=s onclick="mod=JSON.parse(JSON.stringify(MODELOS.tdt));edM()">Modelo 3D&amp;T</button><button class=s onclick="mod=JSON.parse(JSON.stringify(MODELOS.zero));edM()">Do zero</button></div>${mod.secoes.map((s,i)=>`<div class=card><div class=row><input value="${esc(s.t)}" oninput="mod.secoes[${i}].t=this.value" placeholder="Título da seção"><button class=x onclick="mod.secoes.splice(${i},1);edM()">✕</button></div>${s.campos.map((c,j)=>`<div class=row style="margin-top:6px"><input value="${esc(c.n)}" oninput="mod.secoes[${i}].campos[${j}].n=this.value" placeholder="Nome do campo"><select onchange="mod.secoes[${i}].campos[${j}].k=this.value">${Object.entries(T).map(([k,t])=>`<option value=${k} ${c.k===k?'selected':''}>${t}</option>`).join('')}</select><button class=s onclick="mod.secoes[${i}].campos.splice(${j},1);edM()">✕</button></div>`).join('')}<button class=s style="margin-top:8px" onclick="mod.secoes[${i}].campos.push({n:'Novo campo',k:'txt'});edM()">+ Campo</button></div>`).join('')}<div class=row><button class=s onclick="mod.secoes.push({t:'Nova seção',campos:[]});edM()">+ Seção</button><button onclick="salvarModelo()">Salvar modelo</button></div><p class=mu>Em campos de atributo, o modificador (ex.: Força 16 → +3) é calculado sozinho.</p></div>`}
async function salvarModelo(){try{await db.doc('campanhas/'+cid).update({modelo:mod});mod=null;alert('Modelo salvo! As fichas já usam o novo modelo.')}catch(e){alert('Erro ao salvar o modelo.')}}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init();
</script></body></html>
