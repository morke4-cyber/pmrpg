<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mRPG</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mRPG">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f5f3ff;--cd:#fff;--tx:#1f1b2e;--mu:#7a7390;--pr:#7c3aed;--pk:#ec4899;--bd:#e4defa;--gm:#fff4d6;--me:#ede4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15111f;--cd:#221b33;--tx:#f1ecff;--mu:#a69cc4;--bd:#38305a;--gm:#3a3015;--me:#3b2a66}}
:root[data-theme="dark"]{--bg:#15111f;--cd:#221b33;--tx:#f1ecff;--mu:#a69cc4;--bd:#38305a;--gm:#3a3015;--me:#3b2a66}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{background:linear-gradient(90deg,var(--pr),var(--pk));color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700}
header span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--pr);color:#fff}
button.s{background:var(--bd);color:var(--tx)}button.h{background:rgba(255,255,255,.2);padding:6px 10px}button.x{background:#e11d48}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx)}
textarea{min-height:70px;resize:vertical}textarea.lg{min-height:160px;max-height:80vh}.m .n,.m .rbt{text-shadow:0 0 1px rgba(0,0,0,.55),0 0 3px rgba(0,0,0,.25)}label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.c{padding:16px;overflow:auto;flex:1}.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 0 10px}
.it{display:flex;align-items:center;gap:10px;cursor:pointer}.it b{flex:1}.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
nav{display:flex;background:var(--cd);border-top:1px solid var(--bd)}nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:11px 2px;font-size:13px}nav button.on{color:var(--pr);font-weight:700;box-shadow:inset 0 -3px var(--pk)}
#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:84%;padding:7px 11px;border-radius:14px;background:var(--cd);border:1px solid var(--bd);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;background:var(--me)}.m.gm{background:#111!important;color:#fff!important;border:1px solid #f5b400}
.m.dado{background:var(--cd);border:1px dashed var(--pk);font-family:ui-monospace,monospace;font-size:14px}
.n{font-size:12px;font-weight:700;color:var(--pr)}.tg{font-size:10px;background:var(--pk);color:#fff;border-radius:6px;padding:1px 5px;margin-left:5px}.tg.g{background:#f5b400;color:#222}
.pin{background:var(--gm);border-bottom:1px solid #f5b400;padding:7px 12px;font-size:13px;display:flex;gap:8px}.pin span{flex:1;white-space:pre-wrap}
.cmp{padding:8px;border-top:1px solid var(--bd);background:var(--cd);display:flex;flex-direction:column;gap:6px}
.q{display:flex;flex-wrap:wrap;gap:6px}.q button{padding:6px 10px;background:var(--bd);color:var(--tx)}
.mod{min-width:44px;text-align:center;font-weight:700;color:var(--pk)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.ov .card{width:100%;max-width:420px;margin:0}
h2,h3{margin:6px 0}.err{color:#e11d48;font-size:13px;min-height:18px}
.m img,.m video{max-width:100%;max-height:300px;border-radius:10px;display:block;margin-top:4px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:5px;background:var(--bd)}
.big{width:96px;height:96px;border-radius:14px;object-fit:cover;background:var(--bd);display:block}.row>.big,.row>img{flex:none}
.pv{display:flex;flex-direction:column;gap:4px;font-size:13px}.pv:empty{display:none}
.ch{border-radius:10px;padding:5px 9px;background:var(--bd)}.ch.ok{background:rgba(34,197,94,.2)}.ch.er{background:rgba(225,29,72,.2)}
button.on{background:var(--pk);color:#fff}
.sp{background:var(--tx);color:transparent;border-radius:4px;cursor:pointer}.sp.on{color:inherit;background:var(--bd)}
code{background:var(--bd);padding:1px 4px;border-radius:4px}
.pa{padding:0;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--bd);font-size:20px;line-height:44px;text-align:center}.pa img{width:100%;height:100%;object-fit:cover;display:block}.row>#cab{flex:none}
.m{position:relative}.m.ha{margin-top:28px}.m.ha .n{padding-right:36px}
.m .mav{position:absolute;top:-26px;right:-10px;width:46px;height:46px;max-width:none;max-height:none;margin:0;border-radius:50%;object-fit:cover;border:2px solid var(--bg);background:var(--bd);cursor:zoom-in}
.m{background:var(--bot,var(--cd));color:var(--tot,var(--tx))}.m.me{background:var(--bme,var(--me));color:var(--toe,var(--tx))}
.bdg{background:#e11d48;color:#fff;border-radius:999px;min-width:22px;height:22px;padding:0 6px;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.nl{align-self:center;font-size:12px;color:#fff;background:var(--pk);border-radius:999px;padding:3px 12px;margin:8px 0}
.rp{background:rgba(127,127,127,.18);border-radius:8px;padding:4px 8px;margin:3px 0 5px;font-size:13px;cursor:pointer;overflow:hidden;max-height:3.8em}
.rbt{cursor:pointer;font-size:15px;padding:0 4px;color:var(--mu);}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--pk)}100%{box-shadow:0 0 0 0 transparent}}.m.fl{animation:fl 1.2s}
.pd{width:10px;height:10px;border-radius:50%;background:#9ca3af;display:inline-block;margin-left:6px}
#msgs{background:url(fundo-chat.jpg) center/cover no-repeat var(--bg)}
.m{filter:brightness(.92)}
#msgs{padding:10px 6px}
.m .mav{right:-6px}
.m:not(.me) .mav{right:auto;left:-6px}
.m.ha:not(.me) .n{padding-right:0;padding-left:36px}
.hrw{text-align:right;font-size:11px;line-height:1;margin-top:3px}
#bsc{position:fixed;inset:0;z-index:60;background:var(--bg);padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto}#bsc .card{cursor:pointer}
#gav{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);background:var(--cd);border-left:1px solid var(--bd);z-index:55;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;box-shadow:-6px 0 20px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .2s}
#entm{position:absolute;left:0;top:0;pointer-events:none;overflow:hidden;box-sizing:border-box;border:solid transparent;color:var(--tx);white-space:pre-wrap;overflow-wrap:break-word}
#ent::placeholder{color:#8a8a99;opacity:.9}
.eb{text-shadow:.5px 0 currentColor,-.5px 0 currentColor}.es{text-decoration:line-through}.ei{color:#a78bfa;text-decoration:underline dotted}.ec{background:rgba(127,127,127,.28);border-radius:3px}.ep{background:rgba(127,127,127,.5)}
.m.sus{border-style:dashed;border-color:#8b5cf6}
.lx{margin-top:6px;padding:6px 8px;border:1px dashed #f5b400;border-radius:8px;background:rgba(245,180,0,.12);font-size:13px}.tk{margin-left:4px;vertical-align:middle;cursor:pointer}
.pg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:7;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden;pointer-events:none;will-change:transform;box-shadow:0 0 22px rgba(0,0,0,.28)}
.pgi{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
#app:has(.hm),#app:has(.sc){touch-action:pan-y}
html,body{overscroll-behavior-x:none}
/* ===== visual das telas Campanhas e Amigos (modo claro = mockup; modo escuro automático) ===== */
:root{--bnh:64px}
body.tabs,.pg.tt{--bg:#fefaee;--cd:#f3edf8;--tx:#2a1632;--mu:#8b7a8a;--bd:#e4d6ef;--pr:#4a2260;--ac:#4a2260;--ch:#e6d6f1;--bi:#f0eff4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body.tabs,:root:not([data-theme="light"]) .pg.tt{--bg:#15111d;--cd:#221a2f;--tx:#efe3fb;--mu:#a592bd;--bd:#392b50;--ac:#d4b5f6;--ch:#33264a;--bi:#241b32}}
:root[data-theme="dark"] body.tabs,:root[data-theme="dark"] .pg.tt{--bg:#15111d;--cd:#221a2f;--tx:#efe3fb;--mu:#a592bd;--bd:#392b50;--ac:#d4b5f6;--ch:#33264a;--bi:#241b32}
i.ic{font-style:normal;display:block}.ic svg,.ic img{width:100%;height:100%;display:block;object-fit:contain}.ol{fill:var(--bg)}
.ic.il{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em}
header.th{background:none;color:var(--tx);position:relative;padding:14px 12px 8px 16px;font-size:21px}
header.th>span:first-child{max-width:calc(50% - 40px);flex:none}
header.th .lg{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);width:36px;height:36px;color:var(--ac)}
header.th{justify-content:space-between}header.th button.h{background:none;color:var(--tx);font-size:24px;line-height:1;padding:4px 10px}
.bq{position:relative;margin:4px 0 12px}.bq>.ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mu);pointer-events:none}
.bq input{padding:13px 16px 13px 46px;border-radius:999px;background:var(--bi);border:0;font-size:16px}
.chs{display:flex;gap:8px;margin:0 0 14px}
.chip{background:var(--bi);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:7px 16px;font-size:15px;display:inline-flex;align-items:center;gap:7px}.chip.on{background:var(--ch);font-weight:600}
.chip .bdg{background:var(--pr);min-width:20px;height:20px;font-size:12px}
.sh{color:var(--mu);font-weight:600;font-size:16px;margin:4px 0 6px}
.cr{display:flex;align-items:center;gap:12px;padding:9px 2px;cursor:pointer}
.av2{width:54px;height:54px;border-radius:50%;border:2px solid var(--bd);background:var(--ch);overflow:hidden;flex:none;color:var(--ac);display:flex;align-items:center;justify-content:center}
.av2 img{width:100%;height:100%;object-fit:cover}.av2 .ic{width:68%;height:68%}
.cr .mid{flex:1;min-width:0}.cr .nm{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600}
.cr .nm b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cr .bdg{background:var(--pr);flex:none}
.pvw{color:var(--mu);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pvw.nv{color:var(--tx);font-weight:600}
.cr .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}.rt .tm{font-size:13px;color:var(--mu)}
.rt button{background:none;color:var(--mu);padding:3px 4px;width:34px;height:28px;border-radius:8px}.rt .ic{width:22px;height:22px;margin:0 auto}
.pm{min-width:250px;padding:6px;margin:0}.pm>div{padding:12px 14px;cursor:pointer;border-radius:10px;display:flex;gap:12px;align-items:center;font-size:16px}.pm>div:active{background:var(--ch)}
.bl{display:flex!important;gap:10px;align-items:center;justify-content:center}.bl .ic{width:20px;height:20px}
#bn{position:fixed;left:0;right:0;bottom:0;z-index:8;display:none;justify-content:center;background:var(--bg);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#bn .in{display:flex;width:100%;max-width:640px}
#bn button{flex:1;background:none;border-radius:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--bnh);font-size:14px}
#bn button.on{color:var(--ac);font-weight:700}
#bn .ic{position:relative;width:52px;height:34px;overflow:visible}#bn button:not(.on) .ic img{opacity:.55}
#bn .bdg{position:absolute;top:-6px;right:2px;height:18px;min-width:18px;font-size:11px;background:var(--pr);color:#fff;padding:0 5px}
body.tabs #bn{display:flex}body.tabs #app{padding-bottom:var(--bnh)}
body.tabs .pg{padding-bottom:calc(var(--bnh) + env(safe-area-inset-bottom,0px))}
body.kb #bn{display:none}body.kb.tabs #app{padding-bottom:0}
/* ===== cabeçalho dos chats (claro/escuro) ===== */
header.ch{--hb:#fefaee;--hx:#2a1632;--hl:#e4d6ef;--hc:#e6d6f1;background:var(--hb);color:var(--hx);border-bottom:1px solid var(--hl);padding:9px 6px;gap:6px;font-size:20px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) header.ch{--hb:#241a36;--hx:#ecdff9;--hl:#3a2b52;--hc:#33264a}}
:root[data-theme="dark"] header.ch{--hb:#241a36;--hx:#ecdff9;--hl:#3a2b52;--hc:#33264a}
header.ch>span:not(.pd){font-weight:700}
header.ch button.h{background:none;color:var(--hx);padding:6px 8px;line-height:0;font-size:22px}
header.ch button.h .ic{width:24px;height:24px}
.tav{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--hl);background:var(--hc);color:var(--hx);display:flex;align-items:center;justify-content:center}
.tav img{width:100%;height:100%;object-fit:cover;display:block;margin:0;border-radius:0}.tav .tdi{width:68%;height:68%}.tav .ep{font-size:20px;flex:none}
/* ===== aba Amigos ===== */
header.th .hb{display:flex;margin-left:auto}header.th .hb button.h .ic{width:24px;height:24px}
.ph{font-size:24px;margin:4px 0 12px;color:var(--tx)}
.pcard{display:flex;gap:14px;align-items:center;padding:14px;border:1.5px solid var(--bd);border-radius:20px;background:var(--cd)}
.pav{width:78px;height:78px;border-radius:18px;overflow:hidden;flex:none;cursor:pointer;background:var(--ch);display:flex;align-items:center;justify-content:center;font-size:32px}.pav img{width:100%;height:100%;object-fit:cover}
.pin2{min-width:0;cursor:pointer}.pin2 b{font-size:20px}
.addb{width:100%;background:var(--ch);color:var(--tx);border:0;border-radius:14px;padding:13px;font-size:17px;margin:10px 0 14px}
.av2 .ep{font-size:26px}
.xr{background:var(--bi);color:var(--mu);border-radius:50%;width:32px;height:32px;padding:0;font-size:14px;flex:none}
.rq{flex-wrap:wrap;cursor:default}.rqb{display:flex;gap:8px;width:100%;padding-left:66px}.rqb button{padding:8px 16px;font-size:15px;border-radius:12px}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #msgs{background:var(--chatimg) center/cover no-repeat #15111f}}
:root[data-theme="dark"] #msgs{background:var(--chatimg) center/cover no-repeat #15111f}
/* ===== PC (tela larga + mouse): barra superior + lista de campanhas ao lado do chat. Celular/tablet NÃO são afetados ===== */
@media (min-width:900px) and (any-pointer:fine){
:root{--tbh:72px;--sw:290px}
*{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
/* telas de login (sem barra lateral): painel central como antes */
html,body{overflow:hidden}
body:not(.dsk){background:#0b0910}
body:not(.dsk) #app{max-width:560px;background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.07),0 0 48px rgba(0,0,0,.65)}

/* ---- paleta do modo CLARO (padrão) ---- */
body.dsk,body.dsk.tabs{--dbgi:linear-gradient(180deg,#f6effb,#eadff5);--dpn:#fefaee;--dbr:#e0cdee;--dac:#4a2260;--dhv:#f3eafa;--dsel:#e9daf5;--dec:#9a78bd;--dsh:0 2px 14px rgba(74,34,96,.08);
--bg:#fefaee;--cd:#f6f0fa;--tx:#2a1632;--mu:#85708a;--bd:#e4d6ef;--pr:#5a2d82;--ac:#4a2260;--ch:#e6d6f1;--bi:#f0eaf5;--me:#e8dcf6;
--chb:#e0cdee;--chbg:#f0eaf5;--ring:#d6c0e8;--ringg:none;--bdgb:#5a2d82;--bdgt:#fff;--glf:none;--glf2:none;--hgr:none;--io:1;--lgf:none}
/* ---- paleta do modo ESCURO ---- */
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body.dsk,:root:not([data-theme="light"]) body.dsk.tabs{--dbgi:radial-gradient(1100px 520px at 18% -8%,#1c1052 0,transparent 62%),#0c0820;--dpn:#150d33;--dbr:#35267a;--dac:#4a2db3;--dhv:#1f1548;--dsel:#2a1f66;--dec:#6f4cd6;--dsh:none;
--bg:#150d33;--cd:#1c1340;--tx:#f3edff;--mu:#a99ddc;--bd:#33266f;--pr:#6c3df0;--ac:#cdb6ff;--ch:#33266f;--bi:#1c1340;--me:#2c2068;
--chb:#4a3a95;--chbg:#1c1340;--ring:#7b5bd6;--ringg:0 0 8px rgba(124,77,255,.35);--bdgb:#8b6cf5;--bdgt:#150d33}}
:root[data-theme="dark"] body.dsk,:root[data-theme="dark"] body.dsk.tabs{--dbgi:radial-gradient(1100px 520px at 18% -8%,#1c1052 0,transparent 62%),#0c0820;--dpn:#150d33;--dbr:#35267a;--dac:#4a2db3;--dhv:#1f1548;--dsel:#2a1f66;--dec:#6f4cd6;--dsh:none;
--bg:#150d33;--cd:#1c1340;--tx:#f3edff;--mu:#a99ddc;--bd:#33266f;--pr:#6c3df0;--ac:#cdb6ff;--ch:#33266f;--bi:#1c1340;--me:#2c2068;
--chb:#4a3a95;--chbg:#1c1340;--ring:#7b5bd6;--ringg:0 0 8px rgba(124,77,255,.35);--bdgb:#8b6cf5;--bdgt:#150d33}

body.dsk,body.dsk.tabs{background:var(--dbgi);color:var(--tx)}
body.dsk #bn{display:none!important}

/* ---- barra superior ---- */
#dtb,#dsb{display:none}
body.dsk #dtb{display:flex;position:fixed;top:0;left:0;right:0;height:var(--tbh);align-items:center;gap:12px;padding:0 20px 0 24px;z-index:8;color:var(--tx)}
#dtb .dlg{width:52px;height:52px;border-radius:50%;background:var(--ch);border:2px solid var(--ring);box-shadow:var(--ringg);padding:8px;flex:none;color:var(--ac)}
#dtb .dtt{font-size:22px;font-weight:700;margin-left:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dtb .dbt{background:none;color:var(--tx);width:44px;height:44px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1}
#dtb .dbt:hover{background:var(--dhv)}
#dtb .dbt .ic{width:26px;height:26px}
#dtb .dav{overflow:hidden;border:2px solid var(--ring);box-shadow:var(--ringg);width:42px;height:42px;font-size:20px}
#dtb .dav img{width:100%;height:100%;object-fit:cover;display:block}

/* ---- barra lateral ---- */
body.dsk #dsb{display:flex;flex-direction:column;position:fixed;left:14px;top:var(--tbh);bottom:14px;width:var(--sw);background:var(--dpn);border:1px solid var(--dbr);border-radius:18px;box-shadow:var(--dsh);z-index:5;overflow:hidden;color:var(--tx)}
#dsb .dnav{display:flex;flex-direction:column;gap:4px;padding:10px 10px 6px;flex:none}
#dsb .dnav button{display:flex;align-items:center;gap:14px;background:none;color:var(--tx);border-radius:10px;padding:11px 12px;font-size:15px;text-align:left;width:100%}
#dsb .dnav button:hover{background:var(--dhv)}
#dsb .dnav button.act{background:var(--dac);color:#fff;font-weight:600}
#dsb .dnav .ic{width:26px;height:26px;flex:none}
#dsb .dnav span:not(.bdg){flex:1}
#dsb .dnav .bdg{position:static;margin-left:auto}
#dsl{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:6px 12px 8px}
#dsl>*{flex:none}
#dsl .sh{order:-3;color:var(--tx);font-size:16px;font-weight:700;margin:12px 4px 8px}
#dsl .bq{order:-2;margin:0 0 10px}
#dsl .bq input{padding:11px 14px 11px 42px;font-size:14px}
#dsl .bq>.ic{left:13px;width:18px;height:18px}
#dsl .chs{order:-1;margin:0 0 8px;gap:5px;flex-wrap:nowrap}
#dsl .chip{padding:5px 9px;font-size:13px;gap:5px;white-space:nowrap}
#dsl .chip.on{color:var(--tx)}
#dsl .chip .bdg{min-width:16px;height:16px;font-size:10px;padding:0 4px}
#dsl .cr{padding:9px 10px;gap:11px;border-radius:12px}
#dsl .cr:hover{background:var(--dhv)}
#dsl .cr.sel{background:var(--dsel)}
#dsl .av2{width:48px;height:48px}
#dsl .cr .nm{font-size:15px}
#dsl .pvw{font-size:13px}
#dsl .rt .tm{font-size:12px}
#dsl .rt button{height:24px}
#dsl .rt .ic{width:20px;height:20px}
#dsl h3{font-size:14px}
#dsl .card{background:var(--cd)}
#dsb .dsd{flex:none;height:170px;display:flex;align-items:center;justify-content:center;color:var(--dec);opacity:.9;pointer-events:none}
#dsb .dsd .ic{width:150px;height:160px}
@media (max-height:760px){#dsb .dsd{display:none}}

/* ---- área principal (chat, amigos, etc.) ---- */
body.dsk #app,body.dsk.tabs #app{position:fixed;left:calc(var(--sw) + 26px);right:14px;top:var(--tbh);bottom:14px;height:auto;max-width:none;margin:0;padding:0!important;background:var(--dpn);border:1px solid var(--dbr);border-radius:18px;box-shadow:var(--dsh);overflow:hidden}
body.dsk .pgi{max-width:none}
body.dsk #app .c{padding-left:max(18px,calc((100% - 860px)/2));padding-right:max(18px,calc((100% - 860px)/2))}
body.dsk #app>header:not(.ch):not(.th){background:var(--dpn);color:var(--tx);border-bottom:1px solid var(--dbr)}
body.dsk #app>header:not(.ch):not(.th) button.h{background:none;color:var(--tx)}
body.dsk header.th{justify-content:flex-end;padding:12px 16px 4px}
body.dsk header.th>span:first-child,body.dsk header.th .lg{display:none}
body.dsk header.th .hb button[onclick*="menuTopo"]{display:none}
body.dsk #bsc{top:var(--tbh);left:calc(var(--sw) + 26px);right:14px;bottom:14px;inset:var(--tbh) 14px 14px calc(var(--sw) + 26px);border-radius:18px}

/* cabeçalho do chat */
:root body.dsk header.ch{background:var(--dpn);border-bottom:1px solid var(--dbr);padding:10px 14px;gap:10px}
body.dsk header.ch .tav{width:42px;height:42px}
body.dsk header.ch>span:not(.pd){font-size:20px}
.dkb{display:none!important}
body.dsk .dkb{display:inline-flex!important}

/* mensagens e compositor */
body.dsk #msgs{padding:16px 40px;gap:8px}
body.dsk .m{max-width:min(620px,78%)}
body.dsk .cmp{padding:12px 16px;background:var(--dpn);border-top:1px solid var(--dbr)}
body.dsk .cmp .row{gap:12px}
body.dsk #cab .pa{width:46px;height:46px;border:2px solid var(--ring);box-shadow:var(--ringg);background:var(--ch)}
body.dsk #ent{border-radius:12px;padding:12px 14px;background:var(--bi);border-color:var(--dbr)}
body.dsk .cmp .row>button:last-child{padding:12px 24px;border-radius:12px;font-weight:700;background:var(--pr);color:#fff}

function rolar(e){e=String(e).replace(/\s+/g,'').toLowerCase();if(!/^[+-]?(\d*d(\d+|f|%)(k[hl]\d*)?|\d+)([+-](\d*d(\d+|f|%)(k[hl]\d*)?|\d+))*$/.test(e))return null;let tot=0,out=[];
for(const m of e.matchAll(/([+-]?)(\d*)d(\d+|f|%)(?:k([hl])(\d*))?|([+-]?)(\d+)/g)){
if(m[3]){const sg=m[1]==='-'?-1:1,f=m[3]==='%'?100:m[3]==='f'?0:Math.min(+m[3],1000);let n=Math.min(m[2]?+m[2]:1,100),k=m[4];if(k&&n===0){n=2;k='l'}if(f<0||(m[3]!=='f'&&!f))return null;let r=[];for(let i=0;i<n;i++)r.push(m[3]==='f'?Math.floor(Math.random()*3)-1:1+Math.floor(Math.random()*f));let a=r,sh=r;if(k){const kn=Math.max(1,+m[5]||1),ix=r.map((v,i)=>i).sort((x,y)=>k==='h'?r[y]-r[x]:r[x]-r[y]),ok=new Set(ix.slice(0,kn));a=r.filter((v,i)=>ok.has(i));sh=r.map((v,i)=>ok.has(i)?v:'('+v+')')}tot+=sg*a.reduce((x,y)=>x+y,0);out.push((sg<0?'−':'')+'['+sh.join(', ')+']')}
else{const v=(m[6]==='-'?-1:1)*+m[7];tot+=v;out.push((v<0?'−':'+')+Math.abs(v))}}
return{e,t:tot,txt:e+': '+out.join(' ').replace(/ ([+−])/g,' $1')+' = '+tot}}

function cmdForca(tx){if(!/^\/f(\s|$)/i.test(tx))return;if(!admin)return{mudo:1};
const m=tx.match(/^\/f\s+(.+?)\s*=\s*([+-]?\d+)\s*$/i);if(!m)return{erro:'Use: /f d20=17  ou  /f 2d6+3=11'};
if(!rolar(m[1]))return{erro:'Expressão de dados inválida.'};const alvo=+m[2];
for(let i=0;i<30000;i++){const r=rolar(m[1]);if(r.t===alvo)return{r}}
return{erro:'Não deu para chegar a '+alvo+' com essa rolagem.'}}

(function(){

const A=()=>$('#app'),T='transform .22s cubic-bezier(.2,.8,.3,1)';
/* 1 = arrastar p/ esquerda abre amigos · -1 = arrastar p/ direita volta ao menu · 0 = nada */
function dirDe(x,alvo,m){
  if(document.body.classList.contains('dsk'))return 0;
  if(!uid||anim||tl==='auth'||$('.ov')||$('#bsc'))return 0;
  if(alvo&&alvo.closest&&alvo.closest('input,textarea,select,canvas,[contenteditable="true"]'))return 0;

  if(tl==='home')return 1;

  return(!m&&x>=innerWidth-28)?1:0;
}
function inicia(x,y,alvo,m){ini=null;const d=dirDe(x,alvo,m);if(d)ini={x,y,d}}
function pos(p){const a=A();if(ini.d===1){a.style.transform='translateX('+(-p)+'px)';pn.style.transform='translateX('+(W-p)+'px)'}else{a.style.transform='translateX('+p+'px)';pn.style.transform='translateX('+(p-W)+'px)'}const q=p>W*.5;setAba(ini.d===1?(q?'amigos':'campanhas'):(q?'campanhas':'amigos'))}
function comeca(){
  W=innerWidth;drag=true;ld=0;lt=Date.now();vel=0;
  pn=document.createElement('div');pn.className='pg tt';pn.style.transition='none';pn.innerHTML='<div class=pgi></div>';
  pn.style.transform='translateX('+(ini.d===1?W:-W)+'px)';
  const i=pn.firstChild;
  if(ini.d===1){
    i.innerHTML=socH||'<header class=th><span>Amigos</span></header><div class="c sc"><p class=mu>Carregando…</p></div>';

  }else i.innerHTML=homeHtml(listaC,listaAd);
  document.body.appendChild(pn);marcaOnline();if(ini.d===-1)filtra(pn);

}
function move(x,y,e){
  if(!ini)return;
  let p=(ini.x-x)*ini.d;
  if(!drag){
    const ax=Math.abs(x-ini.x),ay=Math.abs(y-ini.y);
    if(ax<8&&ay<8)return;
    if(ay>ax*.8||p<=0){ini=null;return}

  p=Math.max(0,Math.min(p,W));

}

const lidoO=()=>{try{return Number(localStorage.getItem(chave()))||0}catch(e){return 0}};
const salvaO=t=>{try{localStorage.setItem(chave(),String(t))}catch(e){}};
const ultT=()=>msgsO.length?(msgsO[msgsO.length-1].t||0):0;
const st=document.createElement('style');
st.textContent='#oocw{position:fixed;top:0;bottom:0;overflow:hidden;z-index:11;pointer-events:none}'
+'#oocp{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(100%);pointer-events:auto;box-shadow:-8px 0 24px rgba(0,0,0,.35);will-change:transform}'
+'#oocp.an{transition:transform .22s cubic-bezier(.2,.8,.3,1)}'
+'#oocm{flex:1;overflow:auto;padding:10px 8px;display:flex;flex-direction:column;gap:6px;min-height:0}'
+'#oocp .oocs{font-size:12px;font-weight:400;color:var(--mu);margin-left:6px}'
+'#oocb{position:fixed;z-index:8;width:26px;height:64px;top:45%;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2px;background:var(--pr);color:#fff;border-radius:13px 0 0 13px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:-2px 2px 8px rgba(0,0,0,.3)}';
document.head.appendChild(st);

function pos(){const r=$('#app').getBoundingClientRect();wrap.style.left=r.left+'px';wrap.style.width=r.width+'px'}
function criaPn(){
  if(pn&&pn.isConnected)return pn;
  wrap=document.createElement('div');wrap.id='oocw';
  pn=document.createElement('div');pn.id='oocp';
  pn.innerHTML='<header class=ch><button class=h onclick="oocFecha()" title="Fechar">'+ic('voltar')+'</button><span>Fora de contexto<span class=oocs>papo fora da história</span></span></header><div id=oocm></div><div class=cmp><div class=row><textarea id=oocx rows=1 placeholder="Mensagem fora de contexto…" style="min-height:0;height:44px;max-height:120px;resize:none;flex:1;width:100%" oninput="auto(this)" onkeydown="oocTecla(event)"></textarea><button onclick="oocEnvia()">Enviar</button></div></div>';
  wrap.appendChild(pn);document.body.appendChild(wrap);pos();render(true);return pn;
}
function destroi(){if(wrap){wrap.remove()}wrap=pn=null;aberto=false;d=null}
function badge(){
  let b=document.getElementById('oocb');
  const ver=tl==='camp'&&!monitor&&!aberto&&naoO>0&&camp;
  if(!ver){if(b)b.style.display='none';return}
  if(!b){b=document.createElement('div');b.id='oocb';b.title='Chat fora de contexto';b.onclick=()=>abre();document.body.appendChild(b)}
  const r=$('#app').getBoundingClientRect();b.style.left=(r.right-26)+'px';
  b.innerHTML='<span>💬</span><span>'+(naoO>99?'99+':naoO)+'</span>';b.style.display='flex';
}
function render(fundoSempre){
  const e=document.getElementById('oocm');if(!e)return;
  const fundo=fundoSempre||e.scrollHeight-e.scrollTop-e.clientHeight<80||!e.children.length;
  const dono=camp&&camp.mestre;
  e.innerHTML=msgsO.length?msgsO.map(m=>{const me=m.uid===uid;
    return '<div class="m '+(me?'me':'')+'" id="o-'+esc(m.id)+'"><div class=n style="color:'+cor(m.uid)+'">'+esc(m.nome||m.uid)+(m.uid===dono?'<span class="tg g">MESTRE</span>':'')+'</div>'+fmt(m.texto)+'<div class=hrw><span class=mu>'+hora(m.t,m.id)+'</span>'+((me||dono===uid)&&!m._p?' <span style="cursor:pointer" title="Apagar" onclick="oocApaga(\''+esc(m.id)+'\')">🗑</span>':'')+'</div></div>'}).join('')
    :'<p class=mu style="text-align:center">Nenhuma mensagem ainda. Aqui é o papo fora da história.</p>';
  if(fundo)e.scrollTop=e.scrollHeight;
}
function marca(){const t=ultT();if(t>lidoO())salvaO(t);naoO=0;badge()}
function iniciaO(){
  if(monitor||!camp)return;
  if(un&&cidO===cid)return;
  if(un)un();
  cidO=cid;msgsO=[];pendO={};primeira=true;naoO=0;vistoT=0;
  const id=cid;
  const u0=db.collection('campanhas/'+id+'/ooc').orderBy('t').limit(300).onSnapshot(sn=>{
    if(id!==cid)return;
    msgsO=sn.docs.map(x=>({id:x.id,...x.data()}));
    for(const k in pendO){if(msgsO.some(x=>x.id===k))delete pendO[k];else{msgsO.push(pendO[k]);msgsO.sort((a,b)=>(a.t||0)-(b.t||0))}}
    const lt=lidoO(),novas=msgsO.filter(m=>m.uid!==uid&&m.t>lt&&!m._p);
    const chegou=!primeira&&msgsO.some(m=>m.uid!==uid&&m.t>vistoT&&!m._p);
    vistoT=ultT();primeira=false;
    if(aberto){marca();render()}else{naoO=novas.length;badge()}
    if(chegou&&(!aberto||document.hidden)){try{if(!silencio(cid))som()}catch(e){}}
  },()=>{});
  un=()=>{u0();un=null;cidO=null};
  subs.push(un);
}
const _om=ouveMsgs;ouveMsgs=function(){_om();iniciaO()};

function abre(){
  if(tl!=='camp'||monitor)return;
  criaPn();pos();W=wrap.getBoundingClientRect().width;
  aberto=true;pn.classList.add('an');pn.style.transform='translateX(0)';
  marca();render(true);
  setTimeout(()=>{const x=document.getElementById('oocx');if(x&&!matchMedia('(pointer:coarse)').matches)x.focus()},240);
}
function fecha(){
  if(!pn)return;aberto=false;pn.classList.add('an');pn.style.transform='translateX(100%)';
  const x=document.getElementById('oocx');if(x)x.blur();badge();
}
window.oocFecha=fecha;
window.oocTecla=e=>{if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();oocEnvia()}};
window.oocEnvia=async function(){
  const t=document.getElementById('oocx');if(!t||!camp||monitor)return;
  const tx=t.value.trim();if(!tx)return;
  t.value='';auto(t);
  const m={t:agora(),uid,nome:eu.nome,texto:tx},r=db.collection('campanhas/'+cid+'/ooc').doc(),k=r.id;
  pendO[k]={id:k,...m,_p:1};msgsO=msgsO.concat(pendO[k]);render(true);
  try{await r.set(m)}catch(e){delete pendO[k];msgsO=msgsO.filter(x=>x.id!==k);render();alert('Não foi possível enviar a mensagem. Se é a primeira vez, aplique o SQL do chat fora de contexto no Supabase (arquivo chat-fora-de-contexto-e-amigos.sql).')}
};
window.oocApaga=async function(id){
  if(!confirm('Apagar esta mensagem?'))return;
  const ant=msgsO;msgsO=msgsO.filter(x=>x.id!==id);render();
  try{await db.doc('campanhas/'+cid+'/ooc/'+id).delete()}catch(e){msgsO=ant;render();alert('Não foi possível apagar.')}
};
addEventListener('keydown',e=>{if(e.key==='Escape'&&aberto)fecha()});
addEventListener('resize',()=>{if(wrap)pos()});

/* gesto: puxar da borda direita (abrir) / arrastar o cabeçalho para a direita (fechar) */
function comecaOk(x,alvo,mouse){
  if(!uid||tl!=='camp'||monitor||!camp||$('.ov')||$('#bsc'))return null;
  if(alvo&&alvo.closest&&alvo.closest('input,textarea,select,canvas,#mpst,#mpc,[contenteditable="true"]'))return null;
  if(aberto){return alvo&&alvo.closest&&alvo.closest('#oocp header')?'fecha':null}
  const r=$('#app').getBoundingClientRect();
  return(x>=r.right-36&&x<=r.right+1)?'abre':null;
}
function ini(x,y,alvo,mouse){d=null;const m=comecaOk(x,alvo,mouse);if(m)d={m,x,y,drag:false,p:0,lt:0,v:0}}
function mov(x,y,e){
  if(!d)return;
  if(!d.drag){
    const ax=Math.abs(x-d.x),ay=Math.abs(y-d.y);
    if(ax<8&&ay<8)return;
    const dir=d.m==='abre'?d.x-x:x-d.x;
    if(ay>ax*.8||dir<=0){d=null;return}
    criaPn();pos();W=wrap.getBoundingClientRect().width;pn.classList.remove('an');
    d.drag=true;d.lt=Date.now();document.body.style.userSelect='none';
  }
  if(e&&e.cancelable)e.preventDefault();
  let p=d.m==='abre'?d.x-x:W-(x-d.x);p=Math.max(0,Math.min(p,W));
  const n=Date.now();if(n>d.lt){d.v=d.v*.3+((p-d.p)/(n-d.lt))*.7;d.lt=n}d.p=p;
  pn.style.transform='translateX('+(W-p)+'px)';
}
function fim(cancel){
  const x=d;d=null;document.body.style.userSelect='';
  if(!x||!x.drag)return;
  const abrir=!cancel&&(x.m==='abre'?(x.p>W*.28||(x.v>.45&&x.p>30)):!(x.p<W*.72||(x.v<-.45&&x.p<W-30)));
  pn.classList.add('an');
  if(abrir){aberto=true;pn.style.transform='translateX(0)';marca();render(true)}
  else{aberto=false;pn.style.transform='translateX(100%)';badge()}
}
document.addEventListener('touchstart',e=>{if(e.touches.length>1){fim(true);return}const t=e.touches[0];ini(t.clientX,t.clientY,e.target,false)},{passive:true});
document.addEventListener('touchmove',e=>{if(!d)return;const t=e.touches[0];mov(t.clientX,t.clientY,e)},{passive:false});
document.addEventListener('touchend',()=>{const g=d&&d.drag;fim(false);if(g)bloqO=Date.now()});
document.addEventListener('touchcancel',()=>fim(true));
document.addEventListener('mousedown',e=>{if(e.button!==0)return;mouseO=true;ini(e.clientX,e.clientY,e.target,true)});
document.addEventListener('mousemove',e=>{if(mouseO)mov(e.clientX,e.clientY,e)});
document.addEventListener('mouseup',()=>{if(!mouseO)return;mouseO=false;const g=d&&d.drag;fim(false);if(g)bloqO=Date.now()});
document.addEventListener('click',e=>{if(Date.now()-bloqO<350){e.stopPropagation();e.preventDefault()}},true);

/* limpeza ao sair da campanha e atualização da etiqueta de não lidas */
setInterval(()=>{
  if(tl!=='camp'||!camp){if(wrap)destroi();naoO=0;badge();return}
  if(wrap&&!aberto&&!d)pos();
  badge();
},500);
})();

/* ---------- adicionar amigos direto na campanha ---------- */
window.addAmigosCamp=async function(){
  if($('.ov')||!camp||monitor)return;
  const o=document.createElement('div');o.className='ov';o.onclick=e=>{if(e.target===o)o.remove()};
  o.innerHTML='<div class=card style="max-height:80vh;overflow:auto"><h3>Adicionar amigos</h3><p class=mu>Carregando…</p></div>';
  document.body.appendChild(o);
  let am=[];
  try{
    am=(await db.collection('data/users/'+uid).get()).docs.map(x=>x.data()).filter(x=>x.fr);
    await Promise.all(am.map(async x=>{try{const p=await db.doc('usuarios/'+x.fr).get();if(p.exists){const u=p.data();x.nome=u.nome;x.foto=u.foto||''}}catch(e){}}));
  }catch(e){}
  am.sort((a,b)=>String(a.nome||a.fr).localeCompare(String(b.nome||b.fr),'pt-BR'));
  const ja=new Set(membros.map(m=>m.id));
  const c=o.firstChild;
  c.innerHTML='<h3>Adicionar amigos</h3><p class=mu>Quem você adicionar já entra na campanha e recebe um aviso.</p>'
    +(am.length?am.map(x=>'<div class="card it" style="cursor:default" data-f="'+esc(x.fr)+'"><span class=av style="width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex:none">'+(x.foto?'<img src="'+esc(x.foto)+'" alt="" style="width:100%;height:100%;object-fit:cover">':'👤')+'</span><b>'+esc(x.nome||x.fr)+'</b>'+(ja.has(x.fr)?'<span class=mu>Na campanha</span>':'<button data-add="'+esc(x.fr)+'" data-n="'+esc(x.nome||x.fr)+'">Adicionar</button>')+'</div>').join(''):'<p class=mu>Você ainda não tem amigos adicionados. Use a aba Amigos da tela inicial.</p>')
    +'<button class=s style="width:100%;margin-top:8px" id=addfx>Fechar</button>';
  c.querySelector('#addfx').onclick=()=>o.remove();
  c.querySelectorAll('button[data-add]').forEach(b=>b.onclick=async()=>{
    const fr=b.dataset.add,nome=b.dataset.n;b.disabled=true;b.textContent='…';
    try{
      const{data,error}=await db.cl.rpc('adicionar_amigo_campanha',{c:cid,amigo:fr});
      if(error)throw error;
      const nm=(data&&data.nome)||nome;
      b.replaceWith(Object.assign(document.createElement('span'),{className:'mu',textContent:'Adicionado ✓'}));
      db.collection('campanhas/'+cid+'/msgs').add({t:agora(),uid,tipo:'sys',nome:nm,texto:'foi adicionado à campanha'}).catch(()=>{});
      db.collection('dm/'+par(uid,fr)+'/msgs').add({t:agora(),uid,texto:'📜 Te adicionei na campanha "'+camp.nome+'". Ela já está na sua lista!',tipo:'addcamp',cid}).catch(()=>{});
    }catch(e){
      b.disabled=false;b.textContent='Adicionar';
      const msg=String((e&&e.message)||e);
      alert(/Could not find the function|PGRST202|schema cache/i.test(msg)?'Falta aplicar o SQL no Supabase (arquivo chat-fora-de-contexto-e-amigos.sql).':'Não foi possível adicionar: '+msg);
    }
  });
};
